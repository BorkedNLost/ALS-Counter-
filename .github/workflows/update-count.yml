name: Update Roblox Player Count

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes
  workflow_dispatch:         # also lets you run manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch player count from Roblox
        run: |
          RESPONSE=$(curl -s "https://games.roblox.com/v1/games?universeIds=4509896324")
          PLAYING=$(echo "$RESPONSE" | jq '.data[0].playing')
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"playing\": $PLAYING, \"updated\": \"$NOW\"}" > count.json
          echo "Updated: $PLAYING players"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add count.json
          git diff --staged --quiet || git commit -m "Update player count"
          git push
